
name: Extract EDU BRAIN project

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      workflows: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project
        run: |
          mkdir extracted
          unzip EDU_BRAIN_Android_V1.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted EDU_BRAIN_Android_V1.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add EDU BRAIN Android project"
          git push
